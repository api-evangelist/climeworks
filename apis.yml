aid: climeworks
name: Climeworks
description: 'Climeworks AG is a Swiss carbon dioxide removal company founded in 2009
  as an ETH Zurich spin-off by Christoph Gebald and Jan Wurzbacher. It designs, builds
  and operates direct air capture (DAC) plants that filter CO2 out of ambient air through
  an adsorption-desorption cycle and then permanently mineralize it underground with
  storage partners such as Carbfix in Iceland - the Orca and Mammoth facilities. Through
  Climeworks Solutions it also sells risk-mitigated carbon removal portfolios that blend
  its own DAC removals with certified third-party suppliers, delivered within seven years
  of purchase and tracked by corporate buyers in an online customer platform. Climeworks
  is a supplier of carbon removal rather than a software vendor: it publishes no public
  developer portal, no API documentation and no machine-readable API contract, and its
  removals reach programmatic buyers through third-party carbon marketplaces instead.'
